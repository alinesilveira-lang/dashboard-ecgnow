<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard ECGNOW - CPVH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --navy: #0D2137;
      --cyan: #0ea5e9;
      --warn: #f59e0b;
      --bad: #ef4444;
      --good: #10b981;
      --muted: #64748b;
      --light-bg: #f1f7fc;
    }

    * {
      font-family: 'Nunito', sans-serif;
    }

    body {
      background: #f8fafc;
      color: var(--navy);
    }

    /* Header/Menu */
    .navbar {
      background: var(--navy);
      border-bottom: 3px solid var(--cyan);
      padding: 16px 0;
    }

    .navbar-brand {
      font-family: 'Bricolage Grotesque', serif;
      font-weight: 800;
      color: var(--cyan) !important;
      font-size: 18px;
    }

    .nav-link {
      color: #dbeafe !important;
      margin: 0 8px;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .nav-link:hover,
    .nav-link.active {
      border-bottom-color: var(--cyan);
      color: var(--cyan) !important;
    }

    /* Container */
    .container-fluid {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Page transition */
    .page {
      display: none;
      animation: fadeIn 0.3s;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .spinner {
      border: 3px solid var(--light-bg);
      border-top: 3px solid var(--cyan);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="index-dashboard.html">
        ECGNow • CPVH • Viver de Holter
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="resumo.html">Resumo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="visao-geral.html">Visão Geral</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="base-alunos.html">Base de Alunos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="engajamento.html">Engajamento</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="esteira-talentos.html">Esteira de Talentos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="financeiro.html">Financeiro</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="satisfacao.html">Satisfação</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="demografia.html">Demografia</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="leitura-executiva.html">Leitura Executiva</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="loading">
          <div class="spinner"></div>
          <p>Carregando dashboard...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Redirecionar para resumo.html por padrão
    window.location.href = 'resumo.html';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
