<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Educação · CPVH · ECGNow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DASHBOARD EDUCAÇÃO ECGNOW · CPVH (Curso Profissão Viver de Holter)
   Design System oficial: Bricolage Grotesque + Nunito · navy/cyan
   Capa compacta (1 tela) + visão expandida
   ============================================================ */
:root{
  --navy:#0D2137; --navy2:#0a3d6e; --cyan:#0ea5e9; --cyan-soft:#e0f2fe;
  --bg:#f4f8fb; --card:#ffffff; --line:#e2e8f0;
  --txt:#0D2137; --muted:#5b7187;
  --ok:#10b981; --ok-soft:#d1fae5; --warn:#f59e0b; --warn-soft:#fef3c7;
  --bad:#ef4444; --bad-soft:#fee2e2;
  --radius:18px; --shadow:0 4px 18px rgba(13,33,55,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5}
h1,h2,h3,.brand,.kpi-value{font-family:'Bricolage Grotesque',sans-serif}

/* ---------- Topbar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;box-shadow:0 2px 14px rgba(13,33,55,.25)}
.topbar-inner{max-width:1280px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.brand small{font-family:'Nunito';font-weight:700;font-size:11px;color:#9fd8f8;text-transform:uppercase;letter-spacing:1.5px;display:block}
.period-chip{background:rgba(14,165,233,.18);border:1px solid rgba(14,165,233,.45);color:#bfe9ff;font-size:12px;font-weight:800;padding:5px 14px;border-radius:999px;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{color:#cfe7f7;text-decoration:none;font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:999px;transition:.2s}
.nav a:hover,.nav a.active{background:rgba(14,165,233,.25);color:#fff}

.wrap{max-width:1280px;margin:0 auto;padding:30px 28px 70px}
section{margin-bottom:48px;scroll-margin-top:90px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.sec-head h2{font-size:24px;font-weight:800;color:var(--navy)}
.sec-head .tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--cyan);background:var(--cyan-soft);padding:4px 12px;border-radius:999px}
.sec-sub{color:var(--muted);font-size:13.5px;margin-bottom:20px;max-width:880px}

/* ---------- Cards & grids ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.g-2,.g-3,.g-4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g-2,.g-3,.g-4{grid-template-columns:1fr}.wrap{padding:20px 14px 60px}}

.kpi{position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--cyan),var(--navy2))}
.kpi-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px}
.kpi-value{font-size:26px;font-weight:800;color:var(--navy);margin:6px 0 2px;white-space:nowrap}
.kpi-sub{color:var(--muted);font-weight:700;font-size:11.5px}
.farol{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.farol.g{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.farol.y{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.farol.r{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}

.chart-card h3{font-size:15.5px;font-weight:700;color:var(--navy);margin-bottom:2px}
.chart-card .hint{font-size:12px;color:var(--muted);margin-bottom:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
svg text{font-family:'Nunito',sans-serif}

.insight{display:flex;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-bottom:12px;align-items:flex-start}
.insight .ico{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.insight b{color:var(--navy)}
.insight p{font-size:13.5px;color:#3b536b;margin-top:2px}
.ico.g{background:var(--ok-soft)}.ico.y{background:var(--warn-soft)}.ico.r{background:var(--bad-soft)}.ico.b{background:var(--cyan-soft)}

.pill{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800}
.pill.g{background:var(--ok-soft);color:#047857}.pill.y{background:var(--warn-soft);color:#92400e}.pill.r{background:var(--bad-soft);color:#b91c1c}

.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:40px;border-top:1px solid var(--line);padding-top:18px}

/* ---------- Capa · Resumo (1 tela) ---------- */
#viewResumo{max-width:1280px;margin:0 auto;padding:16px 28px 20px;display:grid;grid-template-columns:370px minmax(0,1fr);gap:16px;overflow:hidden}
.rs-hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 70%,#0c5a9e 100%);border-radius:22px;color:#fff;padding:26px 26px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(13,33,55,.28);position:relative;overflow:hidden}
.rs-hero::after{content:'';position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.35),transparent 70%)}
.rs-kicker{font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#9fd8f8}
.rs-titulo{font-family:'Bricolage Grotesque';font-size:clamp(22px,3vh,28px);font-weight:800;line-height:1.15;margin-top:4px}
.rs-verdict{font-size:12.5px;color:#cfe7f7;font-weight:600;margin-top:6px;line-height:1.45}
.rs-big{font-family:'Bricolage Grotesque';font-size:clamp(34px,5vh,46px);font-weight:800;line-height:1.05;margin:2px 0 2px}
.rs-big small{font-size:15px;font-weight:700;color:#9fd8f8;font-family:'Nunito'}
.rs-hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;border-top:1px solid rgba(255,255,255,.16);padding-top:14px;position:relative;z-index:1}
.rs-hl{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:#9fd8f8}
.rs-hv{font-family:'Bricolage Grotesque';font-size:clamp(15px,2.1vh,19px);font-weight:700;margin-top:2px}
.rs-hv small{font-family:'Nunito';font-size:11.5px;font-weight:700;color:#bfe9ff}
.rs-proj{margin-top:auto;font-size:11.5px;font-weight:700;color:#bfe9ff;background:rgba(14,165,233,.16);border:1px solid rgba(14,165,233,.4);border-radius:12px;padding:9px 13px;line-height:1.5;position:relative;z-index:1}
.rs-proj b{color:#fff;font-weight:800}
.rs-proj .pl{font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#7dd3fc;display:block;margin-bottom:2px}
.rs-cta{margin-top:12px;align-self:flex-start;border:none;cursor:pointer;font-family:'Nunito';font-weight:800;font-size:13.5px;color:var(--navy);background:linear-gradient(90deg,#7dd3fc,#38bdf8);padding:11px 20px;border-radius:999px;box-shadow:0 4px 16px rgba(14,165,233,.45);transition:.2s;position:relative;z-index:1}
.rs-cta:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(14,165,233,.55)}
.rs-right{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;min-width:0}
.rs-chips{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.rs-chip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.rs-chip .l{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
.rs-chip .v{font-family:'Bricolage Grotesque';font-size:clamp(18px,2.6vh,23px);font-weight:800;color:var(--navy);margin-top:3px}
.rs-chip .s{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.rs-mid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;min-height:0}
.rs-chart-card,.rs-funil-card{display:flex;flex-direction:column;min-height:0;padding:16px 18px}
.rs-card-title{font-family:'Bricolage Grotesque';font-size:14px;font-weight:700;color:var(--navy)}
.rs-card-sub{font-family:'Nunito';font-size:11px;color:var(--muted);font-weight:700;margin-left:6px}
.rs-chart{flex:1;min-height:0;display:flex;align-items:center}
.rs-chart svg{width:100%;max-height:100%}
.rs-funil{flex:1;min-height:0;display:flex;align-items:center}
.rs-funil svg{width:100%;max-height:100%}
.rs-destaques{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px 20px}
.rs-dest{display:flex;gap:11px;align-items:flex-start}
.rs-dest .ico{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.rs-dest b{font-size:12.5px;color:var(--navy);display:block;margin-bottom:2px}
.rs-dest p{font-size:11.8px;color:#3b536b;line-height:1.45}
@media(max-width:1024px){#viewResumo{grid-template-columns:1fr;overflow:auto;height:auto !important}.rs-chips{grid-template-columns:repeat(2,1fr)}.rs-mid,.rs-destaques{grid-template-columns:1fr}}
@media(max-height:760px) and (min-width:1024px){.rs-hero{padding:18px 22px 16px;gap:10px}.rs-destaques{padding:12px 16px}.rs-chip{padding:9px 12px}}
</style>
</head>

<script>
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmtN=v=>v.toLocaleString('pt-BR');

/* ---------- Helpers SVG (sem dependências) ---------- */
const NS='http://www.w3.org/2000/svg';
function svgEl(w,h){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`0 0 ${w} ${h}`);s.style.width='100%';return s;}
function el(tag,attrs,txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e;}
function barChart(cid,labels,vals,opts={}){
  const c=document.getElementById(cid);
  if(!c || !vals || vals.length === 0) return;
  c.innerHTML='';
  const w=opts.w||560,h=opts.h||250,padL=opts.padL||44,padR=12,padT=22,padB=28;
  const max=Math.max(...vals.map(v=>Number(v)||0))*1.15||1;
  const n=vals.length;
  const s=svgEl(w,h);
  const x=i=>padL+i*(w-padL-padR)/n+(w-padL-padR)/n*0.16;
  const bw=(w-padL-padR)/n*0.68;
  const y=v=>padT+(h-padT-padB)*(1-v/max);
  for(let g=0;g<=3;g++){const v=max*g/3;
    s.appendChild(el('line',{x1:padL,x2:w-padR,y1:y(v),y2:y(v),stroke:'#eef3f8'}));
    s.appendChild(el('text',{x:padL-7,y:y(v)+4,'text-anchor':'end','font-size':10,fill:'#5b7187'},opts.fmt?opts.fmt(v):Math.round(v)));}
  vals.forEach((v,i)=>{
    const hl=opts.highlight!=null&&i===opts.highlight;
    s.appendChild(el('rect',{x:x(i),y:y(v),width:bw,height:Math.max(y(0)-y(v),1),fill:hl?'#0ea5e9':(opts.color||'#0a3d6e'),rx:5}));
    s.appendChild(el('text',{x:x(i)+bw/2,y:y(v)-6,'text-anchor':'middle','font-size':10.5,'font-weight':800,fill:'#0D2137'},opts.fmt?opts.fmt(v):v));
    s.appendChild(el('text',{x:x(i)+bw/2,y:h-8,'text-anchor':'middle','font-size':10.5,'font-weight':700,fill:'#5b7187'},labels[i]));});
  c.appendChild(s);
}
function donut(cid,slices,centerTop,centerBot,opts={}){
  const c=document.getElementById(cid);
  if(!c || !slices || slices.length === 0) return;
  c.innerHTML='';
  const w=opts.w||380,h=opts.h||250,cx=opts.cx||115,cy=h/2,r=opts.r||86,ir=r-32;
  const tot=sum(slices.map(s=>Number(s.v)||0));
  const s=svgEl(w,h);
  let a0=-Math.PI/2;
  slices.forEach(sl=>{
    const a1=a0+sl.v/tot*2*Math.PI;
    const large=(a1-a0)>Math.PI?1:0;
    s.appendChild(el('path',{d:`M ${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} A ${r} ${r} 0 ${large} 1 ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)} L ${cx+ir*Math.cos(a1)} ${cy+ir*Math.sin(a1)} A ${ir} ${ir} 0 ${large} 0 ${cx+ir*Math.cos(a0)} ${cy+ir*Math.sin(a0)} Z`,fill:sl.c}));
    a0=a1;});
  s.appendChild(el('text',{x:cx,y:cy-3,'text-anchor':'middle','font-size':19,'font-weight':800,fill:'#0D2137','font-family':'Bricolage Grotesque'},centerTop));
  s.appendChild(el('text',{x:cx,y:cy+15,'text-anchor':'middle','font-size':10,fill:'#5b7187','font-weight':700},centerBot));
  const lx=opts.lx||232, lh=Math.min(34,(h-30)/slices.length);
  slices.forEach((sl,i)=>{
    const ly=(h-slices.length*lh)/2+i*lh+10;
    s.appendChild(el('rect',{x:lx,y:ly,width:12,height:12,rx:4,fill:sl.c}));
    s.appendChild(el('text',{x:lx+18,y:ly+10,'font-size':11,'font-weight':800,fill:'#0D2137'},`${sl.v} · ${(sl.v/tot*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}%`));
    s.appendChild(el('text',{x:lx+18,y:ly+22,'font-size':9.5,fill:'#5b7187','font-weight':700},sl.n));});
  c.appendChild(s);
}
function hBars(cid,items,opts={}){
  const c=document.getElementById(cid);
  if(!c) return;
  c.innerHTML='';
  if(!items || items.length === 0) return;
  const w=opts.w||560,rowH=34,padL=opts.padL||150,padR=64,padT=8;
  const h=padT+items.length*rowH+8;
  const max=Math.max(...items.map(i=>Number(i.v)||0))||1;
  const s=svgEl(w,h);
  items.forEach((it,i)=>{
    const y=padT+i*rowH;
    const bwid=(it.v/max)*(w-padL-padR);
    s.appendChild(el('text',{x:padL-10,y:y+rowH/2+4,'text-anchor':'end','font-size':11.5,'font-weight':700,fill:'#0D2137'},it.n));
    s.appendChild(el('rect',{x:padL,y:y+7,width:Math.max(bwid,2),height:rowH-14,rx:6,fill:it.c||'#0a3d6e'}));
    s.appendChild(el('text',{x:padL+bwid+8,y:y+rowH/2+4,'font-size':11.5,'font-weight':800,fill:'#0D2137'},fmtN(it.v)));});
  c.appendChild(s);
}
function funil(cid,steps,opts={}){
  const c=document.getElementById(cid);
  if(!c || !steps || steps.length === 0) return;
  c.innerHTML='';
  const w=opts.w||560,rowH=opts.rowH||52,padL=8,padR=10,padT=4;
  const h=padT+steps.length*rowH+4;
  const max=Number(steps[0].v)||1;
  const maxBar=(w-padL-padR)*0.52; // barras ocupam até metade; nomes ficam à direita
  const cols=['#0a3d6e','#0d5a94','#0ea5e9','#38bdf8','#10b981'];
  const s=svgEl(w,h);
  steps.forEach((st,i)=>{
    const y=padT+i*rowH;
    const bwid=Math.max((st.v/max)*maxBar,46);
    s.appendChild(el('rect',{x:padL,y:y+8,width:bwid,height:rowH-16,rx:9,fill:cols[i]||'#0ea5e9'}));
    s.appendChild(el('text',{x:padL+12,y:y+rowH/2+4,'font-size':13,'font-weight':800,fill:'#fff','font-family':'Bricolage Grotesque'},st.v));
    const tx=padL+bwid+12;
    if(i>0){
      const taxa=(st.v/steps[i-1].v*100).toLocaleString('pt-BR',{maximumFractionDigits:0});
      s.appendChild(el('text',{x:tx,y:y+rowH/2-2,'font-size':11.5,'font-weight':800,fill:'#0D2137'},st.n));
      s.appendChild(el('text',{x:tx,y:y+rowH/2+11,'font-size':9.5,'font-weight':800,fill:'#0ea5e9'},`▼ ${taxa}% da etapa anterior`));
    }else{
      s.appendChild(el('text',{x:tx,y:y+rowH/2+4,'font-size':11.5,'font-weight':800,fill:'#0D2137'},st.n));
    }
  });
  c.appendChild(s);
}
const KPIS_URL = './kpis.json';

function loadKPIsFromJSON() {
  console.log('📂 Tentando carregar kpis.json de:', KPIS_URL);

  // Tentar primeiro com fetch (moderno)
  fetch(KPIS_URL + '?t=' + Date.now(), {
    method: 'GET',
    cache: 'no-cache'
  })
  .then(res => {
    console.log('📡 Resposta recebida, status:', res.status);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    return res.json();
  })
  .then(result => {
    console.log('📊 JSON parseado:', result);
    if (result.success && result.data) {
      const kpis = result.data;
      console.log('✅ KPIs carregados com sucesso via fetch:', kpis);
      updateDashboardKPIs(kpis);
    } else {
      console.error('❌ Resposta inválida:', result.message || 'success=false');
      throw new Error('Invalid response format');
    }
  })
  .catch(err => {
    console.error('❌ Fetch falhou:', err.message);
    console.log('🔄 Tentando fallback com XMLHttpRequest...');
    loadKPIsWithXHR();
  });
}
function loadKPIsWithXHR() {
  const xhr = new XMLHttpRequest();
  xhr.open('GET', KPIS_URL + '?t=' + Date.now(), true);
  xhr.onload = function() {
    console.log('📡 XHR Resposta recebida, status:', xhr.status);
    if (xhr.status === 200) {
      try {
        const result = JSON.parse(xhr.responseText);
        console.log('📊 JSON parseado via XHR:', result);
        if (result.success && result.data) {
          console.log('✅ KPIs carregados com sucesso via XHR:', result.data);
          updateDashboardKPIs(result.data);
        } else {
          throw new Error('Invalid response format');
        }
      } catch (e) {
        console.error('❌ Erro ao parsear JSON:', e.message);
      }
    } else {
      console.error('❌ XHR falhou com status:', xhr.status);
    }
  };
  xhr.onerror = function() {
    console.error('❌ XHR erro ao carregar:', xhr.statusText);
  };
  try {
    xhr.send();
  } catch (e) {
    console.error('❌ XHR não pode enviar requisição:', e.message);
  }
}
function updateDashboardKPIs(kpis) {
  const total = kpis.total_alunos || 233;
  const totalCadastrados = kpis.total_cadastrados || 233;
  const ativoEstudando = kpis.ativo_estudando || 86;
  const concluidos = kpis.concluidos || 95;

          <div style="font-size:9px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--muted)">Hotmart</div>
          <div style="font-family:'Bricolage Grotesque';font-size:18px;font-weight:800;color:var(--navy);margin-top:4px">${progresso_hotmart}%</div>
          <div style="font-size:9.5px;color:var(--muted);font-weight:700">Progresso médio</div>
        </div>
        <div style="background:#fed7aa;border-radius:10px;padding:12px 14px">
          <div style="font-size:9px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:#b45309">Engaj. Baixo</div>
          <div style="font-family:'Bricolage Grotesque';font-size:18px;font-weight:800;color:#b45309;margin-top:4px">${engajDetalhado.baixo}</div>
          <div style="font-size:9.5px;color:#b45309;font-weight:700">${engajDetalhado.baixo_pct}%</div>
        </div>
        <div style="background:#bfdbfe;border-radius:10px;padding:12px 14px">
          <div style="font-size:9px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:#0369a1">Engaj. Médio</div>
          <div style="font-family:'Bricolage Grotesque';font-size:18px;font-weight:800;color:#0369a1;margin-top:4px">${engajDetalhado.medio}</div>
          <div style="font-size:9.5px;color:#0369a1;font-weight:700">${engajDetalhado.medio_pct}%</div>
        </div>
        <div style="background:#fee2e2;border-radius:10px;padding:12px 14px">
          <div style="font-size:9px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:#b91c1c">Engaj. Nenhum</div>
          <div style="font-family:'Bricolage Grotesque';font-size:18px;font-weight:800;color:#b91c1c;margin-top:4px">${engajDetalhado.nenhum}</div>
          <div style="font-size:9.5px;color:#b91c1c;font-weight:700">${engajDetalhado.nenhum_pct}%</div>
        </div>
      </div>`;
  }

  // Engajamento detalhado (Donut)
  const engajaTotal = engajDetalhado.alto + engajDetalhado.medio + engajDetalhado.baixo + engajDetalhado.nenhum;
  const engajaChart = [
    {n:'Alto',v:engajDetalhado.alto,c:'#10b981'},
    {n:'Médio',v:engajDetalhado.medio,c:'#0ea5e9'},
    {n:'Baixo',v:engajDetalhado.baixo,c:'#f59e0b'},
    {n:'Nenhum',v:engajDetalhado.nenhum,c:'#ef4444'}
  ];
  const engajDonutElem = document.getElementById('engajaDonut');
  if(engajDonutElem) {
    donut('engajaDonut', engajaChart, String(engajDetalhado.alto + engajDetalhado.medio), 'contas', {w:450,h:350,cx:120,r:90,lx:240});
  }

  // Atividade Recente (gráfico de barras)
  const atividadeElem = document.getElementById('atividadeChart');
  if(atividadeElem) {
    const ativos7d = kpis.ativos_7_dias || 8;
    const ativos30d = kpis.ativos_30_dias ? kpis.ativos_30_dias.valor : 14;
    const ativos90d = kpis.ativos_90_dias || 25;
    barChart('atividadeChart', ['7 dias', '30 dias', '90 dias'], [ativos7d, ativos30d, ativos90d], {color:'#0ea5e9', fmt:v=>Math.round(v)});
  }

  // ============================================================
  // ATUALIZAR TAGS E TEXTOS DAS SEÇÕES
  // ============================================================

  // Tag "Base de Alunos"
  const baseTag = document.querySelector('#base .sec-head .tag');
  if(baseTag) {
    baseTag.textContent = `${totalCadastrados} matriculados desde ago/2023`;
  }

  // Tag "Engajamento"
  const engajaTag = document.querySelector('#engaja .sec-head .tag');
  if(engajaTag) {
    engajaTag.textContent = `Plataforma Hotmart + trilha do curso`;
  }

  // ============================================================
  // ATUALIZAR LEITURA EXECUTIVA (Insights dinâmicos — compactos)
  // ============================================================

  const leituraExecutiva = document.getElementById('leituraGrid');
  if(leituraExecutiva) {
    // Calcular dados dinâmicos dos gráficos
    const matrMatrVals = (kpis.matriculas_12_meses && kpis.matriculas_12_meses.vals) || [];
    const churnRate = (((baseAlunos.cancelou + baseAlunos.abandono) / total) * 100).toFixed(1);
    const churnQtd = baseAlunos.cancelou + baseAlunos.abandono;
    const pct_inadequimplencia = ((kpis.inadimplencia_qtd / total) * 100).toFixed(0);
    const pct_engajAltoMedio = parseFloat((kpis.engajamento_alto_medio && kpis.engajamento_alto_medio.percentual) || 0).toFixed(1);

    const insights = `
      <div class="insight"><div class="ico g">🧲</div><div><b>Esteira de talentos</b><p>${analistasTotal} formados analistas ECGNOW (${kpis.taxa_aprovacao_pct}% conversão)</p></div></div>
      <div class="insight"><div class="ico b">📈</div><div><b>Recorrência</b><p>${matrMatrVals.reduce((a,b)=>a+b,0)} matrículas em 12 meses</p></div></div>
      <div class="insight"><div class="ico g">🎓</div><div><b>Base ativa</b><p>${ativoEstudando} estudando agora (${taxaConclusao}% conclusão)</p></div></div>
      <div class="insight"><div class="ico y">⚠️</div><div><b>Inadimplência</b><p>${kpis.inadimplencia_valor} em ${kpis.inadimplencia_qtd} alunos</p></div></div>
      <div class="insight"><div class="ico y">📉</div><div><b>Churn</b><p>${churnQtd} alunos (${churnRate}%)</p></div></div>
      <div class="insight"><div class="ico r">🕳️</div><div><b>Em risco</b><p>${baseAlunos.abaixo_50pct} abaixo de 50% de progresso</p></div></div>
    `;

    leituraExecutiva.innerHTML = insights;
    console.log('✅ Leitura Executiva preenchida com', insights.split('insight').length - 1, 'cards');
  } else {
    console.log('⚠️ leituraGrid não encontrado na página');
  }

  console.log('✨ Dashboard atualizado com TODOS os dados do JSON');
}


// Proteger updates para elementos que podem não existir
const safeUpdate = (id, content) => {
  const elem = document.getElementById(id);
  if (elem) elem.innerHTML = content;
};

const originalUpdate = updateDashboardKPIs;
updateDashboardKPIs = function(kpis) {
  try {
    originalUpdate.call(this, kpis);
  } catch (e) {
    console.log('Alguns elementos não existem nesta página - ignorando:', e.message);
  }
};


// Carregar dados
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadKPIsFromJSON);
} else {
  loadKPIsFromJSON();
}
</script>
